<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tài Khoản Nhân Viên - POS Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="mb-0 fw-bold">TÀI KHOẢN NHÂN VIÊN</h2>
      <button class="btn btn-primary" onclick="showAddEmployeeModal()" id="btn-show-add-employee">
        <i class="bi bi-person-plus me-1"></i>+ Thêm Thu Ngân
      </button>
    </div>

    <!-- Thanh tìm kiếm và lọc trạng thái -->
    <div class="card shadow-sm mb-4 border-0">
      <div class="card-body py-3">
        <div class="row g-2 align-items-center">
          <div class="col-md-7 col-lg-8">
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
              <input type="text" id="search-employees" class="form-control" placeholder="Tìm kiếm theo tên đăng nhập hoặc họ tên...">
            </div>
          </div>
          <div class="col-md-5 col-lg-4">
            <div class="input-group">
              <label class="input-group-text bg-white" for="filter-status"><i class="bi bi-funnel text-muted"></i></label>
              <select id="filter-status" class="form-select">
                <option value="all">Tất cả trạng thái</option>
                <option value="active">Đang hoạt động</option>
                <option value="locked">Đã khóa</option>
              </select>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bảng danh sách nhân viên -->
    <div class="card shadow-sm border-0">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0" id="employees-table">
            <thead class="table-light">
              <tr>
                <th scope="col" class="ps-3">Tên đăng nhập</th>
                <th scope="col">Họ Tên</th>
                <th scope="col">Vai Trò</th>
                <th scope="col">Trạng Thái</th>
                <th scope="col" class="text-end pe-3">Hành Động</th>
              </tr>
            </thead>
            <tbody>
              <tr><td colspan="5" class="text-center py-4 text-muted">Đang tải danh sách nhân viên...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Modal Thêm Thu Ngân / Nhân Viên -->
    <div class="modal" id="add-employee-modal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-primary text-white">
            <h5 class="modal-title"><i class="bi bi-person-plus me-2"></i>Thêm Thu Ngân Mới</h5>
            <button type="button" class="btn-close btn-close-white" onclick="closeModal('add-employee-modal')"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label fw-semibold">Tên đăng nhập <span class="text-danger">*</span></label>
              <input type="text" id="add-e-username" class="form-control" placeholder="VD: thungan01" required autocomplete="off">
              <small class="text-muted">Tên đăng nhập là duy nhất trong hệ thống.</small>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Họ tên nhân viên <span class="text-danger">*</span></label>
              <input type="text" id="add-e-fullname" class="form-control" placeholder="VD: Nguyễn Văn A" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Vai trò</label>
              <select id="add-e-role" class="form-select">
                <option value="CASHIER" selected>Thu ngân</option>
                <option value="MANAGER">Quản lý</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Mật khẩu <span class="text-danger">*</span></label>
              <input type="password" id="add-e-password" class="form-control" placeholder="Ít nhất 8 ký tự" required autocomplete="new-password">
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Xác nhận mật khẩu <span class="text-danger">*</span></label>
              <input type="password" id="add-e-confirm-password" class="form-control" placeholder="Nhập lại mật khẩu" required autocomplete="new-password">
            </div>
            <div id="add-e-error" class="alert alert-danger d-none"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="closeModal('add-employee-modal')">Hủy</button>
            <button type="button" class="btn btn-primary" onclick="submitAddEmployee()" id="btn-save-new-employee">Lưu Tài Khoản</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal Sửa Nhân Viên -->
    <div class="modal" id="edit-employee-modal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-dark text-white">
            <h5 class="modal-title"><i class="bi bi-pencil-square me-2"></i>Sửa Thông Tin Tài Khoản</h5>
            <button type="button" class="btn-close btn-close-white" onclick="closeModal('edit-employee-modal')"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="edit-e-id">
            <div class="mb-3">
              <label class="form-label fw-semibold">Tên đăng nhập</label>
              <input type="text" id="edit-e-username" class="form-control" disabled readonly>
              <small class="text-muted">Tên đăng nhập không thể thay đổi.</small>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Họ tên nhân viên <span class="text-danger">*</span></label>
              <input type="text" id="edit-e-fullname" class="form-control" placeholder="Họ tên nhân viên" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Vai trò</label>
              <select id="edit-e-role" class="form-select">
                <option value="CASHIER">Thu ngân</option>
                <option value="MANAGER">Quản lý</option>
              </select>
            </div>
            <div id="edit-e-error" class="alert alert-danger d-none"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="closeModal('edit-employee-modal')">Hủy</button>
            <button type="button" class="btn btn-primary" onclick="submitEditEmployee()" id="btn-save-edit-employee">Lưu Thay Đổi</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal Đặt Lại Mật Khẩu -->
    <div class="modal" id="reset-pass-modal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-warning">
            <h5 class="modal-title"><i class="bi bi-key me-2"></i>Đặt Lại Mật Khẩu</h5>
            <button type="button" class="btn-close" onclick="closeModal('reset-pass-modal')"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="rp-id">
            <p class="text-muted mb-3">Đặt lại mật khẩu cho tài khoản: <strong id="rp-username" class="text-dark"></strong></p>
            <div class="mb-3">
              <label class="form-label fw-semibold">Mật khẩu mới <span class="text-danger">*</span></label>
              <input type="password" id="rp-password" class="form-control" placeholder="Ít nhất 8 ký tự" required autocomplete="new-password">
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Xác nhận mật khẩu mới <span class="text-danger">*</span></label>
              <input type="password" id="rp-confirm-password" class="form-control" placeholder="Nhập lại mật khẩu mới" required autocomplete="new-password">
            </div>
            <div id="rp-error" class="alert alert-danger d-none"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="closeModal('reset-pass-modal')">Hủy</button>
            <button type="button" class="btn btn-warning" onclick="submitResetPassword()" id="btn-save-reset-pass">Đặt Lại Mật Khẩu</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/public/js/auth.js"></script>
  <script src="/public/js/layout.js"></script>
  <script src="/public/js/employees.js"></script>
</body>
</html>
