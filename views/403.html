<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 - Bạn không có quyền truy cập chức năng này</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background-color: #f8f9fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .forbidden-card {
      max-width: 500px;
      width: 90%;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(0, 0, 0, 0.05);
      padding: 2.5rem 2rem;
      text-align: center;
    }
    .icon-wrapper {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem auto;
      background-color: #fff3cd;
      color: #ffc107;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }
  </style>
</head>
<body>
  <div class="forbidden-card">
    <div class="icon-wrapper">
      <i class="bi bi-shield-lock"></i>
    </div>
    <span class="badge bg-danger-subtle text-danger px-3 py-1 rounded-pill mb-2 fw-semibold">Không có quyền truy cập (403)</span>
    <h1 class="h4 fw-bold text-dark mt-2 mb-3">Bạn không có quyền truy cập chức năng này</h1>
    <p class="text-muted small mb-4">
      Tài khoản hiện tại của bạn không được phân quyền để truy cập trang này. Để bảo mật dữ liệu hệ thống, vui lòng quay lại giao diện được cấp phép.
    </p>
    <div class="d-grid gap-2 col-sm-10 mx-auto">
      <a href="/sales" class="btn btn-primary px-4 py-2 shadow-sm fw-medium d-inline-flex align-items-center justify-content-center">
        <i class="bi bi-cart3 me-2"></i> Về trang bán hàng
      </a>
    </div>
  </div>
</body>
</html>
