<!--
  POS Store - Giao diện Lịch Sử Hóa Đơn Bán Hàng (Invoices History)
  Đường dẫn: views/invoices.html

  Mục đích:
  - Cung cấp giao diện tra cứu lịch sử hóa đơn bán hàng theo phân quyền:
    + Thu ngân (CASHIER): Được xem danh sách và chi tiết các hóa đơn do chính mình lập.
    + Quản lý (MANAGER): Được xem toàn bộ hóa đơn của cửa hàng theo quyền API hiện tại.
  - Tìm kiếm theo mã hóa đơn, lọc theo phương thức thanh toán (Tiền mặt / Chuyển khoản QR), khoảng ngày lập.
  - Xem chi tiết từng hóa đơn trong modal: danh sách món hàng đã mua, số tiền, thông tin người bán.
  - Hỗ trợ in ấn hóa đơn và xuất file PDF với định dạng chuẩn sạch (@media print ẩn toàn bộ giao diện quản trị).
-->
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý hóa đơn - POS Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/public/css/style.css">
  <script src="/public/js/layout-init.js"></script>
  <style>
    /* Ẩn vùng in riêng trên màn hình thông thường */
    #invoice-print-section {
      display: none !important;
    }

    /* CSS chuẩn cho bản in (In / Lưu PDF) - Giữ bản in sạch, chỉ in hóa đơn */
    @media print {
      nav, .navbar, .pos-content-container, .pos-topbar-wrapper, .pos-manager-sidebar,
      .modal, .modal-backdrop, #invoices-table, h2, .btn, .btn-close {
        display: none !important;
      }

      body {
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        color: #000000 !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif !important;
      }

      /* Hiển thị duy nhất khu vực in chuyên dụng trực thuộc body */
      #invoice-print-section {
        display: block !important;
        visibility: visible !important;
        position: static !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 20px 25px !important;
        background: #ffffff !important;
        color: #000000 !important;
        box-sizing: border-box !important;
      }

      #invoice-print-section * {
        visibility: visible !important;
      }

      #invoice-print-section table {
        width: 100% !important;
        border-collapse: collapse !important;
        margin-top: 15px !important;
        margin-bottom: 15px !important;
      }

      #invoice-print-section table th,
      #invoice-print-section table td {
        border: 1px solid #333333 !important;
        padding: 6px 10px !important;
        color: #000000 !important;
        background: transparent !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      #invoice-print-section table thead th {
        background-color: #f2f2f2 !important;
        font-weight: 700 !important;
      }

      #invoice-print-section table tfoot th {
        font-weight: 700 !important;
      }
    }
  </style>
</head>
<body>
  <!-- Vùng in riêng độc lập trực thuộc body (chỉ hiển thị khi in / lưu PDF) -->
  <div id="invoice-print-section" aria-hidden="true"></div>

  <div class="pos-content-container">
    <!-- Header -->
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 pb-2 border-bottom gap-2">
      <div>
        <h2 class="page-title mb-1" id="invoices-page-title">
          <i class="bi bi-receipt me-2 text-primary"></i>Quản lý hóa đơn
        </h2>
        <p class="page-subtitle">
          Tra cứu chứng từ bán hàng, chi tiết đơn mua và đối soát phương thức thanh toán
        </p>
      </div>
      <div>
        <button type="button" class="btn btn-outline-secondary btn-sm px-3 shadow-sm" onclick="loadInvoices(currentPage)">
          <i class="bi bi-arrow-clockwise me-1"></i> Làm mới danh sách
        </button>
      </div>
    </div>

    <!-- Bộ lọc tìm kiếm hóa đơn -->
    <div class="card shadow-sm border mb-4">
      <div class="card-body p-3">
        <form id="invoices-filter-form" class="row g-2 align-items-end" onsubmit="event.preventDefault(); applyFilter();">
          <div class="col-md-3">
            <label for="filter-invoice-no" class="form-label small fw-bold text-secondary mb-1">Mã hóa đơn</label>
            <div class="input-group">
              <span class="input-group-text bg-white text-muted"><i class="bi bi-upc-scan"></i></span>
              <input type="text" class="form-control" id="filter-invoice-no" placeholder="VD: HD179170..." autocomplete="off">
            </div>
          </div>
          <div class="col-md-2 col-sm-6">
            <label for="filter-from-date" class="form-label small fw-bold text-secondary mb-1">Từ ngày</label>
            <input type="date" class="form-control" id="filter-from-date">
          </div>
          <div class="col-md-2 col-sm-6">
            <label for="filter-to-date" class="form-label small fw-bold text-secondary mb-1">Đến ngày</label>
            <input type="date" class="form-control" id="filter-to-date">
          </div>
          <div class="col-md-3" id="seller-filter-container" style="display: none;">
            <label for="filter-seller" class="form-label small fw-bold text-secondary mb-1">Người bán (Quản lý)</label>
            <select class="form-select" id="filter-seller">
              <option value="">-- Tất cả người bán --</option>
            </select>
          </div>
          <div class="col-md-2 d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-fill" id="btn-apply-filter">
              <i class="bi bi-funnel me-1"></i> Lọc
            </button>
            <button type="button" class="btn btn-outline-secondary" id="btn-reset-filter" onclick="resetFilter()" title="Đặt lại bộ lọc">
              Đặt lại
            </button>
          </div>
        </form>
        <!-- Thông báo lỗi bộ lọc -->
        <div id="filter-error-alert" class="alert alert-danger py-2 px-3 small mt-3 mb-0 align-items-center" style="display: none;" role="alert">
          <i class="bi bi-exclamation-triangle-fill me-2 fs-6"></i>
          <span id="filter-error-text"></span>
        </div>
      </div>
    </div>
    
    <!-- Danh sách hóa đơn -->
    <div class="card shadow-sm border mb-4">
      <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
        <h5 class="mb-0 fw-bold fs-6 text-dark d-flex align-items-center" id="invoices-list-title">
          <i class="bi bi-card-list me-2 text-primary"></i>Danh sách hóa đơn
        </h5>
        <span class="text-muted small" id="invoices-count-info">Đang tải dữ liệu...</span>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0" id="invoices-table">
            <thead>
              <tr>
                <th class="text-center" style="width: 60px;">ID</th>
                <th>Mã hóa đơn</th>
                <th class="text-end" style="width: 150px;">Tổng tiền</th>
                <th class="text-center" style="width: 150px;">Phương thức</th>
                <th style="width: 170px;">Ngày tạo</th>
                <th>Người bán</th>
                <th class="text-center" style="width: 110px;">Thao tác</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
      <div class="card-footer bg-white d-flex justify-content-between align-items-center flex-wrap gap-2 py-3 border-top">
        <div class="text-muted small">
          Tất cả giao dịch bán hàng đã lưu thành công vào cơ sở dữ liệu
        </div>
        <nav aria-label="Phân trang hóa đơn">
          <ul class="pagination pagination-sm mb-0" id="invoices-pagination">
            <!-- Danh sách các nút phân trang -->
          </ul>
        </nav>
      </div>
    </div>

    <!-- Modal Xem Chi Tiết Hóa Đơn -->
    <div class="modal fade" id="invoice-modal" tabindex="-1" aria-labelledby="invoice-modal-title" aria-hidden="true" style="display:none;">
      <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content shadow border-0">
          <div class="modal-header bg-primary text-white">
            <h5 class="modal-title fw-bold" id="invoice-modal-title">
              <i class="bi bi-receipt me-2"></i>Chi tiết hóa đơn
            </h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close" onclick="closeInvoiceModal()"></button>
          </div>
          <div class="modal-body p-4" id="invoice-modal-body">
            <!-- Khu vực xem trước hóa đơn trên màn hình -->
            <div id="invoice-preview-area"></div>
          </div>
          <div class="modal-footer bg-light justify-content-between">
            <button type="button" id="btn-print-invoice" class="btn btn-primary" onclick="printInvoice()">
              <i class="bi bi-printer me-1"></i> In / Lưu PDF
            </button>
            <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal" onclick="closeInvoiceModal()">Đóng</button>
          </div>
        </div>
      </div>
    </div>
    <div id="modal-backdrop" class="modal-backdrop fade" style="display:none;"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/public/js/auth.js"></script>
  <script src="/public/js/layout.js"></script>
  <script src="/public/js/invoices.js"></script>
</body>
</html>
