<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quản Lý Hóa Đơn - POS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    /* Ẩn vùng in riêng trên màn hình thông thường */
    #invoice-print-section {
      display: none !important;
    }

    /* CSS chuẩn cho bản in (In / Lưu PDF) */
    @media print {
      /* Ẩn toàn bộ giao diện thông thường: menu navbar, container trang, modal, backdrop, nút bấm */
      nav, .navbar, .container, .modal, .modal-backdrop, #invoices-table, h2, .btn, .btn-close {
        display: none !important;
      }

      body {
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        color: #000000 !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif !important;
      }

      /* Hiển thị duy nhất khu vực in chuyên dụng trực thuộc body */
      #invoice-print-section {
        display: block !important;
        visibility: visible !important;
        position: static !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 20px 25px !important;
        background: #ffffff !important;
        color: #000000 !important;
        box-sizing: border-box !important;
      }

      #invoice-print-section * {
        visibility: visible !important;
      }

      /* Bảng in rõ nét, có viền đầy đủ */
      #invoice-print-section table {
        width: 100% !important;
        border-collapse: collapse !important;
        margin-top: 15px !important;
        margin-bottom: 15px !important;
      }

      #invoice-print-section table th,
      #invoice-print-section table td {
        border: 1px solid #333333 !important;
        padding: 6px 10px !important;
        color: #000000 !important;
        background: transparent !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      #invoice-print-section table thead th {
        background-color: #f2f2f2 !important;
        font-weight: 700 !important;
      }

      #invoice-print-section table tfoot th {
        font-weight: 700 !important;
      }
    }
  </style>
</head>
<body>
  <!-- Vùng in riêng độc lập trực thuộc body (chỉ hiển thị khi in / lưu PDF) -->
  <div id="invoice-print-section" aria-hidden="true"></div>

  <div class="container mt-5 pt-3">
    <h2 class="mb-4" id="invoices-page-title">QUẢN LÝ HÓA ĐƠN</h2>

    <!-- Bộ lọc tìm kiếm hóa đơn -->
    <div class="card shadow-sm mb-4 border-0">
      <div class="card-body bg-light rounded">
        <form id="invoices-filter-form" class="row g-3 align-items-end" onsubmit="event.preventDefault(); applyFilter();">
          <div class="col-md-3">
            <label for="filter-invoice-no" class="form-label fw-semibold small text-secondary">Mã Hóa Đơn</label>
            <input type="text" class="form-control" id="filter-invoice-no" placeholder="VD: HD179170..." autocomplete="off">
          </div>
          <div class="col-md-2 col-sm-6">
            <label for="filter-from-date" class="form-label fw-semibold small text-secondary">Từ Ngày</label>
            <input type="date" class="form-control" id="filter-from-date">
          </div>
          <div class="col-md-2 col-sm-6">
            <label for="filter-to-date" class="form-label fw-semibold small text-secondary">Đến Ngày</label>
            <input type="date" class="form-control" id="filter-to-date">
          </div>
          <div class="col-md-3" id="seller-filter-container" style="display: none;">
            <label for="filter-seller" class="form-label fw-semibold small text-secondary">Người Bán (Quản lý)</label>
            <select class="form-select" id="filter-seller">
              <option value="">-- Tất cả người bán --</option>
            </select>
          </div>
          <div class="col-md-2 d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-fill" id="btn-apply-filter">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-funnel me-1" viewBox="0 0 16 16">
                <path d="M1.5 1.5A.5.5 0 0 1 2 1h12a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-.128.334L10 8.692V13.5a.5.5 0 0 1-.342.474l-3 1A.5.5 0 0 1 6 14.5V8.692L1.628 3.834A.5.5 0 0 1 1.5 3.5v-2z"/>
              </svg>
              Lọc
            </button>
            <button type="button" class="btn btn-outline-secondary" id="btn-reset-filter" onclick="resetFilter()" title="Đặt lại bộ lọc">
              Đặt lại
            </button>
          </div>
        </form>
        <!-- Thông báo lỗi bộ lọc -->
        <div id="filter-error-alert" class="alert alert-danger py-2 px-3 small mt-3 mb-0 align-items-center" style="display: none;" role="alert">
          <i class="bi bi-exclamation-triangle-fill me-2 fs-6"></i>
          <span id="filter-error-text"></span>
        </div>
      </div>
    </div>
    
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
        <h5 class="mb-0" id="invoices-list-title">Danh Sách Hóa Đơn</h5>
        <button type="button" class="btn btn-sm btn-outline-light" onclick="loadInvoices(currentPage)">Làm mới</button>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-bordered table-striped table-hover align-middle mb-0" id="invoices-table">
            <thead class="table-dark">
              <tr>
                <th class="text-center" style="width: 60px;">ID</th>
                <th>Mã Hóa Đơn</th>
                <th class="text-end" style="width: 160px;">Tổng Tiền</th>
                <th style="width: 180px;">Ngày Tạo</th>
                <th>Người Bán</th>
                <th class="text-center" style="width: 100px;">Chi Tiết</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
      <div class="card-footer bg-white d-flex justify-content-between align-items-center flex-wrap gap-2 py-3">
        <div class="text-muted small" id="invoices-count-info">
          Đang tải dữ liệu...
        </div>
        <nav aria-label="Phân trang hóa đơn">
          <ul class="pagination pagination-sm mb-0" id="invoices-pagination">
            <!-- Danh sách các nút phân trang -->
          </ul>
        </nav>
      </div>
    </div>

    <!-- Modal Xem Chi Tiết Hóa Đơn -->
    <div class="modal fade" id="invoice-modal" tabindex="-1" aria-labelledby="invoice-modal-title" aria-hidden="true" style="display:none;">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header bg-primary text-white">
            <h5 class="modal-title" id="invoice-modal-title">Chi Tiết Hóa Đơn</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close" onclick="closeInvoiceModal()"></button>
          </div>
          <div class="modal-body p-4" id="invoice-modal-body">
            <!-- Khu vực xem trước hóa đơn trên màn hình -->
            <div id="invoice-preview-area"></div>
          </div>
          <div class="modal-footer">
            <button type="button" id="btn-print-invoice" class="btn btn-primary" onclick="printInvoice()">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-printer me-1" viewBox="0 0 16 16">
                <path d="M2.5 8a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1z"/>
                <path d="M5 1a2 2 0 0 0-2 2v2H2a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h1v1a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-1h1a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-1V3a2 2 0 0 0-2-2H5zM4 3a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2H4V3zm1 5a2 2 0 0 0-2 2v1H2a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v-1a2 2 0 0 0-2-2H5zm7 2v3a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1z"/>
              </svg>
              In / Lưu PDF
            </button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" onclick="closeInvoiceModal()">Đóng</button>
          </div>
        </div>
      </div>
    </div>
    <div id="modal-backdrop" class="modal-backdrop fade" style="display:none;"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/public/js/auth.js"></script>
  <script src="/public/js/layout.js"></script>
  <script src="/public/js/invoices.js"></script>
</body>
</html>
