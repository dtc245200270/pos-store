# ==============================================================================
# POS Store - Cấu Hình Máy Chủ Lưu Trữ Nhật Ký Grafana Loki (Windows Host)
# Tệp: deploy/logging/loki.yml
#
# Mục đích:
# - Quản lý việc tiếp nhận, đánh chỉ mục và lưu trữ log chạy trực tiếp trên hệ điều hành Windows.
# - Cổng HTTP 3100: Lắng nghe cục bộ 127.0.0.1 để nhận push log từ Alloy và truy vấn từ Grafana.
# - Đường dẫn lưu trữ: C:/loki/data (bao gồm chunks và rules).
# - Thời gian lưu giữ mẫu log: Tối đa 168 giờ (7 ngày).
# ==============================================================================

# Vô hiệu hóa chế độ xác thực đa người thuê cho môi trường đơn cửa hàng
auth_enabled: false

server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3100
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: C:/loki/data
  storage:
    filesystem:
      chunks_directory: C:/loki/data/chunks
      rules_directory: C:/loki/data/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

ingester:
  lifecycler:
    join_after: 0s
    min_ready_duration: 0s
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  reject_old_samples: false
  reject_old_samples_max_age: 168h
  allow_structured_metadata: true

analytics:
  reporting_enabled: false
