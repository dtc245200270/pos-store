# ==============================================================================
# POS Store - Cấu Hình Máy Chủ Thu Thập Số Liệu Prometheus (Windows Host)
# Tệp: deploy/monitoring/prometheus.yml
#
# Mục đích:
# - Lắng nghe tại địa chỉ cục bộ 127.0.0.1:9090 trên Windows.
# - Thu thập số liệu định kỳ từ endpoint metrics Node.js tại 127.0.0.1:9101/metrics mỗi 15 giây.
# - Thiết lập nhãn giám sát chuẩn: app="pos_store", env="development".
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'pos_store'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['127.0.0.1:9101']
        labels:
          app: 'pos_store'
          env: 'development'
