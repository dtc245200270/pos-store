# Cấu hình Grafana cho POS Store
# Lắng nghe tại: 127.0.0.1:3030 (không chiếm cổng 3000 của Node.js)

app_mode = production

[server]
http_addr = 127.0.0.1
http_port = 3030
domain = localhost
root_url = %(protocol)s://%(domain)s:%(http_port)s/
enforce_domain = false

[security]
# Tài khoản quản trị mặc định; người dùng có thể đổi mật khẩu qua giao diện
admin_user = admin
admin_password = admin
disable_initial_admin_creation = false

[auth.anonymous]
# Không cho phép truy cập ẩn danh theo yêu cầu đồ án
enabled = false

[users]
allow_sign_up = false
auto_assign_org = true
auto_assign_org_role = Viewer

[analytics]
reporting_enabled = false
check_for_updates = false

[paths]
data = C:/grafana/data
logs = C:/grafana/data/log
plugins = C:/grafana/plugins
provisioning = C:/grafana/conf/provisioning
