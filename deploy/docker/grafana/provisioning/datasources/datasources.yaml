# ==============================================================================
# POS Store - Cấu Hình Nguồn Dữ Liệu Tự Động Cho Grafana (Docker Provisioning)
# Tệp: deploy/docker/grafana/provisioning/datasources/datasources.yaml
#
# Mục đích:
# - Khai báo tự động 2 Datasource chính cho Grafana khi khởi động:
#   1. Prometheus: http://prometheus:9090 (nguồn số liệu hiệu năng, chu kỳ 15s, làm mặc định).
#   2. Loki: http://loki:3100 (nguồn truy vấn nhật ký log, giới hạn tối đa 1000 dòng/truy vấn).
# ==============================================================================

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus-pos-store
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s
      httpMethod: POST

  - name: Loki
    type: loki
    uid: loki-pos-store
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
    jsonData:
      maxLines: 1000
