# ==============================================================================
# POS Store - Cấu Hình Máy Chủ Thu Thập Số Liệu Prometheus (Docker)
# Tệp: deploy/docker/prometheus/prometheus.yml
#
# Mục đích:
# - Thu thập định kỳ số liệu hiệu năng từ máy chủ Node.js Express (cổng 9101, đường dẫn /metrics).
# - Chu kỳ lấy mẫu (scrape_interval): 15 giây một lần, thời gian chờ tối đa (scrape_timeout): 10 giây.
# - Chu kỳ đánh giá cảnh báo (evaluation_interval): 15 giây.
# - Gắn nhãn tự động cho tất cả số liệu: app="pos_store", env="development".
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'pos_store'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app:9101']
        labels:
          app: 'pos_store'
          env: 'development'
