# ==============================================================================
# POS Store - Cấu Hình Máy Chủ Lưu Trữ Nhật Ký Grafana Loki (Docker)
# Tệp: deploy/docker/loki/loki.yml
#
# Mục đích:
# - Quản lý việc tiếp nhận, đánh chỉ mục và lưu trữ tập trung toàn bộ nhật ký hệ thống.
# - Cổng HTTP 3100: Nhận luồng push log từ Grafana Alloy và phục vụ truy vấn LogQL từ Grafana.
# - Cổng gRPC 9096: Giao tiếp nội bộ hiệu năng cao của Loki.
# - Định dạng lưu trữ: Hệ thống tệp (filesystem) với định dạng TSDB schema v13 tối ưu hiệu suất.
# - Thời gian lưu giữ mẫu log: Tối đa 168 giờ (7 ngày).
# ==============================================================================

# Vô hiệu hóa chế độ xác thực đa người thuê (Multi-tenancy) cho môi trường đơn cửa hàng
auth_enabled: false

server:
  http_listen_address: 0.0.0.0
  http_listen_port: 3100
  grpc_listen_address: 0.0.0.0
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

ingester:
  lifecycler:
    join_after: 0s
    min_ready_duration: 0s
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  reject_old_samples: false
  reject_old_samples_max_age: 168h
  allow_structured_metadata: true

analytics:
  reporting_enabled: false
