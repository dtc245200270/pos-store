worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Khong tiet lo phien ban Nginx trong Server header
    server_tokens off;

    sendfile on;
    keepalive_timeout 65;

    # Dinh dang log truy cap an toan cua Nginx:
    # - Su dung $request_method $uri de loai bo hoan toan query string
    # - Khong ghi truong Referer nguyen van de tranh ro ri URL nhay cam
    # - Ghi nhan ma requestId do Node.js tra ve qua $upstream_http_x_request_id
    # - Giu nguyen status, byte gui, request_time va cac chi so thoi gian upstream
    log_format main '$remote_addr - $remote_user [$time_local] "$request_method $uri" '
                    '$status $body_bytes_sent '
                    'req_id="$upstream_http_x_request_id" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/pos_access.log main;
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/pos_error.log warn;
    error_log /var/log/nginx/error.log warn;

    upstream pos_node_backend {
        server app:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost 127.0.0.1;

        # Gioi han kich thuoc goi tin gui len
        client_max_body_size 20M;

        # Khong bat cache trung gian
        proxy_buffering off;

        # Endpoint kiem tra suc khoe rieng cho Nginx va he thong giam sat
        # - Khong ghi vao access log nguoi dung de tranh lam o nhiem log truy cap
        # - Chuyen tiep toi endpoint /healthz cua Node.js backend
        location = /healthz {
            access_log off;
            proxy_pass http://pos_node_backend/healthz;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
        }

        location / {
            proxy_pass http://pos_node_backend;
            proxy_http_version 1.1;

            # Chuyen tiep cac HTTP Header phu hop
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Giu nguyen header X-Request-ID do Node.js tra ve; khong tao ma khac ghi de
            proxy_pass_header X-Request-ID;

            # Giu nguyen cookie phien dang nhap va khong thay doi duong dan cookie
            proxy_cookie_path / /;
            proxy_redirect off;

            # Loai bo header thong tin backend va chong trung lap Cache-Control tu backend
            proxy_hide_header X-Powered-By;
            proxy_hide_header Cache-Control;

            # Khong bat cache cho API hoac cac trang phien lam viec
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;

            # Security Headers:
            # 1. Bao ve chong MIME-type sniffing
            add_header X-Content-Type-Options "nosniff" always;
            # 2. Bao ve chong clickjacking va nhung trang trai phep
            add_header X-Frame-Options "SAMEORIGIN" always;
            # 3. Chinh sach Referrer phu hop
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            # 4. Content Security Policy (CSP) dua theo tai nguyen thuc te:
            #    - Bootstrap CSS/JS va Bootstrap Icons tu cdn.jsdelivr.net
            #    - Ma QR thanh toan VietQR tu img.vietqr.io
            #    - Script va style noi bo phuc vu giao dien POS Store
            #    - Khong bat HSTS vi he thong dang chay tren HTTP localhost
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net data:; img-src 'self' data: https://img.vietqr.io; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
        }
    }
}
