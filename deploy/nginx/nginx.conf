# Cấu hình Nginx Reverse Proxy cho POS Store (Windows)
# Lắng nghe tại: 127.0.0.1:8080
# Chuyển tiếp tới backend Node.js: 127.0.0.1:3000

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Định dạng log truy cập an toàn của Nginx:
    # - Sử dụng $request_method $uri để loại bỏ hoàn toàn query string
    # - Không ghi trường Referer nguyên văn để tránh rò rỉ URL nhạy cảm
    # - Ghi nhận mã requestId do Node.js trả về qua $upstream_http_x_request_id
    # - Giữ nguyên status, byte gửi, request_time và các chỉ số thời gian upstream
    log_format main '$remote_addr - $remote_user [$time_local] "$request_method $uri" '
                    '$status $body_bytes_sent '
                    'req_id="$upstream_http_x_request_id" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log logs/access.log main;
    error_log logs/error.log warn;

    upstream pos_node_backend {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    server {
        listen 127.0.0.1:8080;
        server_name localhost 127.0.0.1;

        # Giới hạn kích thước gói tin gửi lên
        client_max_body_size 20M;

        # Không bật cache trung gian
        proxy_buffering off;

        location / {
            proxy_pass http://pos_node_backend;
            proxy_http_version 1.1;

            # Chuyển tiếp các HTTP Header phù hợp
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Giữ nguyên header X-Request-ID do Node.js trả về; không tạo mã khác ghi đè
            proxy_pass_header X-Request-ID;

            # Giữ nguyên cookie phiên đăng nhập và không thay đổi đường dẫn cookie
            proxy_cookie_path / /;
            proxy_redirect off;

            # Không bật cache cho API hoặc các trang phiên làm việc
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }
    }
}
